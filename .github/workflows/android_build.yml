name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  FLUTTER_VERSION: 'stable'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk: '26.3.11579264'
          cache: true

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Format Dart code
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Dart unit tests
        run: flutter test --no-pub --reporter=expanded

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-build-cache

      - name: Decode keystore (Release signing)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --no-build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 30

      - name: Upload Dart Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-test-reports
          path: |
            test_output/
          retention-days: 30

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Dart analyze
        run: flutter analyze

      - name: Run Ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.1.1/ktlint
          chmod +x ktlint
          ./ktlint --format "android/**/*.kt" "android/**/*.kts" || true

      - name: Run Detekt
        run: |
          dart pub global activate detekt
          export PATH="$PATH:$HOME/.pub-cache/bin"
          detekt --input=lib --config=analysis_options.yaml || true

  release:
    needs: [build, static-analysis]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts/apk

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts/aab

      - name: Display build info
        run: |
          echo "=== Build Artifacts ==="
          ls -la artifacts/
          ls -la artifacts/apk/
          ls -la artifacts/aab/

      - name: Upload Debug APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: apk-mesh-debug
          path: artifacts/apk/app-debug.apk
          retention-days: 90

      - name: Upload Release AAB to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: apk-mesh-release
          path: artifacts/aab/app-release.aab
          retention-days: 90